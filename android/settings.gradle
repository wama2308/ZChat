pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS) // Cambiado de FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
        maven { url("https://www.jitpack.io") }
        maven { url("$rootDir/../node_modules/react-native/android") }
    }
}
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'ZChat'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

include ':watermelondb-jsi'
project(':watermelondb-jsi').projectDir =
    new File(rootProject.projectDir, '../node_modules/@nozbe/watermelondb/native/android-jsi')
